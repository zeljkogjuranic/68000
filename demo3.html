	["16 bit high precision - possible on A500, Atari ST",8192,16384,8192,32],
	["32 bit - A1200 (no blitter), Atari Falcon, PC 386/486, Sony PS2",8192,32768*128,32768*64,256],

	];
var precisionlevel=4;


function init() {
	var canvas=document.getElementById("can1");
	canvas.width=xsize*canscale; canvas.height=ysize*canscale;
	ctx=canvas.getContext("2d");
	ctx.imageSmoothingEnabled=false;
	imagedata=ctx.getImageData(0,0,xsize*canscale,ysize*canscale);
	ctx.scale(canscale,canscale);
}

function rotatemesh(vertices,rotmatrix) {
	var i,x,y,z,x1,y1,z1;
	var result=[];
	for(i=0; i<vertices.length; i++) {
		x1=vertices[i][0]; y1=vertices[i][1]; z1=vertices[i][2];
		if(precision_coord>0) {
			x1=Math.floor(x1*precision_coord)/precision_coord;
			y1=Math.floor(y1*precision_coord)/precision_coord;
			z1=Math.floor(z1*precision_coord)/precision_coord;
		}
		x=x1*rotmatrix[0][0]+y1*rotmatrix[0][1]+z1*rotmatrix[0][2];
		y=x1*rotmatrix[1][0]+y1*rotmatrix[1][1]+z1*rotmatrix[1][2];
		z=x1*rotmatrix[2][0]+y1*rotmatrix[2][1]+z1*rotmatrix[2][2];
		result.push([x,y,z]);
	}
	return result;
}

function drawmesh(a,b,c,x,y,z) {
	var i,j;
	var nfaces=faces.length;
	var facedesc=[];
	// face description:
	// top point 2 bits
	// left point 2 bits - if break is left breakpoint else top point
	// right point 2 bits - if break is right breakpoint else top point
	// bottom point 2 bits
	
	ctx.fillStyle="#000000";
	ctx.fillRect(0,0,xsize,ysize);
	ctx.fillStyle="#FF0000";
	// rotate
	var cosa=Math.cos(a), sina=Math.sin(a);
	var cosb=Math.cos(b), sinb=Math.sin(b);
	var cosc=Math.cos(c), sinc=Math.sin(c);
	if(precision_sine>0) {
		cosa=Math.floor(cosa*precision_sine)/precision_sine;
		sina=Math.floor(sina*precision_sine)/precision_sine;
		cosb=Math.floor(cosb*precision_sine)/precision_sine;
		sinb=Math.floor(sinb*precision_sine)/precision_sine;
		cosc=Math.floor(cosc*precision_sine)/precision_sine;
		sinc=Math.floor(sinc*precision_sine)/precision_sine;
	}
	var rotmatrix=[
		[cosc*cosb,-sinc*cosa+cosc*sinb*sina,sinc*sina+cosc*sinb*cosa],
		[sinc*cosb,cosc*cosa+sinc*sinb*sina,-cosc*sina+sinc*sinb*cosa],
		[-sinb,cosb*sina,cosb*cosa]
	];
	// 1,0,0,0,1,0,0,0,1
	if(precision_sine>0) {
		for(i=0; i<3; i++) {
			for(j=0; j<3; j++) {
				rotmatrix[i][j]=Math.floor(rotmatrix[i][j]*precision_sine)/precision_sine;
			}
		}
	}
	var transformedvert=rotatemesh(vertices,rotmatrix);
	// translate
	for(i=0; i<transformedvert.length; i++) {
		transformedvert[i][0]+=x;
		transformedvert[i][1]+=y;
		transformedvert[i][2]+=z;
	}
	// no 3d clipping for demo
	var z1;
	var v1,v2,v3,n;
	var culfaces=[];
	for(i=0; i<faces.length; i++) {
		culfaces.push(i);
	}
	// perspective and to screen space
	for(i=0; i<transformedvert.length; i++) {
		z1=transformedvert[i][2];
		transformedvert[i][0]=(transformedvert[i][0]*screen_zoom/z1)+xsize/2;
		transformedvert[i][1]=(transformedvert[i][1]*screen_zoom/z1)+ysize/2;
		if(precision_screen>0) {
			transformedvert[i][0]=Math.floor(transformedvert[i][0]*precision_screen)/precision_screen;
			transformedvert[i][1]=Math.floor(transformedvert[i][1]*precision_screen)/precision_screen;
		}
	}
	
	// back face, small area culling
	var f;
	j=culfaces.length; i=0; f=culfaces[0];
	while(i<j) {
		culfaces[i]=f;
		z1=1;
		v1=faces[f][0]; v2=faces[f][1]; v3=faces[f][2];
		n=(transformedvert[v1][0]-transformedvert[v3][0])*(transformedvert[v2][1]-transformedvert[v3][1]); // triangle area
		n+=(transformedvert[v3][0]-transformedvert[v2][0])*(transformedvert[v1][1]-transformedvert[v3][1]);		
		//n*=0.5;
		if(n<(sizelimit*2.0)||z1<0) {
			f=culfaces.pop();
			j--;
		} else {
			i++;
			f=culfaces[i];
		}
	}

	function draw1() {	// draw vertices
		var i;
		for(i=0; i<transformedvert.length; i++) {
			ctx.fillRect(transformedvert[i][0]-2,transformedvert[i][1]-2,4,4);
		}
	}
	
	function draw2() { // draw faces with triangles
	// draw faces
		var i,j;
		for(j=0; j<culfaces.length; j++) {
			i=culfaces[j];
			v1=faces[i][0]; v2=faces[i][1]; v3=faces[i][2];
			ctx.beginPath();
			ctx.moveTo(transformedvert[v1][0],transformedvert[v1][1]);
			ctx.lineTo(transformedvert[v2][0],transformedvert[v2][1]);
			ctx.lineTo(transformedvert[v3][0],transformedvert[v3][1]);
			ctx.closePath();
			ctx.fillStyle="#"+faces[i][3].toString(16).padStart(8,"0").toUpperCase();
			ctx.fill();
			//ctx.stroke();
		}
	}
	
	function clearcanvasdata() {
		var i;
		var data=imagedata.data;

		for(i=0; i<xsize*ysize*canscale*canscale; i++) {
			data[i*4]=0; data[i*4+1]=0; data[i*4+2]=0; data[i*4+3]=255;
		}		
	}
	
	function scalecanvasdata() {
		var i,j,v1,v2,v3;
		var data=imagedata.data;
		for(j=ysize-1; j>=0; j--) {
			v1=(j+1)*xsize*canscale*canscale*4-4;
			v3=(j+1)*xsize*4-4;
			for(v2=0; v2<canscale; v2++) {
				for(i=xsize-1; i>=0; i--) {
					for(k=0; k<canscale; k++) {
						data[v1-4*k]=data[v3];
						data[v1-4*k+1]=data[v3+1];
						data[v1-4*k+2]=data[v3+2];
						data[v1-4*k+3]=data[v3+3];
					}
					v1-=canscale*4; v3-=4;
				}
				v3+=xsize*4;
			}
		}
	}

	function draw3() {	// draw to imagedata
		function drawtriangle(points,color) {
			var s=0;
			if(points[1][1]<points[0][1]) s=1;
			if(points[2][1]<points[s][1]) s=2;
			var x1,y1,x2,y2,x3,y3,x4,y4,xs1,xs2;
			x1=points[s][0]-0.5; y1=points[s][1]-0.5; s=(s+1)%3;
			x2=points[s][0]-0.5; y2=points[s][1]-0.5; s=(s+1)%3;
			x3=x1; y3=y1;
			x4=points[s][0]-0.5; y4=points[s][1]-0.5;
			var i=Math.floor(Math.max(y1,0));
			var j=Math.floor(Math.min(Math.max(y2,y4),ysize));
			var k,ip;
			while(i<=j) {
				if(i>Math.floor(y2)) {
					x1=x2; y1=y2; x2=x4; y2=y4;
				}
				if(i>Math.floor(y4)) {
					x3=x4; y3=y4; x4=x2; y4=y2;
				}
				xs2=Math.floor(x1+(x2-x1)*(i-y1)/(y2-y1));
				xs1=Math.floor(x3+(x4-x3)*(i-y3)/(y4-y3));
				if(xs1<0) xs1=0; if(xs2>xsize) xs2=xsize;
				if(xs1<xs2&&y2!=y1&&y4!=y3) {
					ip=(i*xsize+xs1)*4;
					for(k=xs1; k<xs2; k++) {
						data[ip]=color[0]; ip++;
						data[ip]=color[1]; ip++;
						data[ip]=color[2]; ip++;
						data[ip]=color[3]; ip++;
					}
				}
				i++;
			}
		}
		var i,j,k,col;
		var data=imagedata.data;
		var v1,v2,v3,pt1,pt2,pt3;

		clearcanvasdata();
		for(j=0; j<culfaces.length; j++) {
			i=culfaces[j];
			v1=faces[i][0]; v2=faces[i][1]; v3=faces[i][2];
			pt1=[transformedvert[v1][0],transformedvert[v1][1]];
			pt2=[transformedvert[v2][0],transformedvert[v2][1]];
			pt3=[transformedvert[v3][0],transformedvert[v3][1]];
			col=[(faces[i][3]&0xff000000)>>>24,(faces[i][3]&0x00ff0000)>>>16,(faces[i][3]&0x0000ff00)>>>8,faces[i][3]&0x000000ff];
			drawtriangle([pt1,pt2,pt3],col);
		}
		//drawtriangle([[30,110],[120,50],[10,10]],[255,0,0]);
		scalecanvasdata();

		ctx.putImageData(imagedata,0,0);
	}
	
	function draw4() {
		function drawquad16(points,edges1,color) {
			var leftspan=[];
			var rightspan=[];
			var polytop=0;
			var polybot=0;
			var i,j,ip;
			for(i=0; i<=ysize; i++) {
				leftspan.push(0);
				rightspan.push(0);
			}
			var s=0;
			if(points[1][1]<points[0][1]) s=1;
			if(points[2][1]<points[s][1]) s=2;
			if(points[3][1]<points[s][1]) s=3;
			var b=0;
			if(points[1][1]>points[0][1]) b=1;
			if(points[2][1]>points[b][1]) b=2;
			if(points[3][1]>points[b][1]) b=3;
			polytop=Math.floor(points[s][1]);
			polybot=Math.floor(points[b][1]);
			var b2=b+1; b2=b2%4;
			var b3=b2+1; b3=b3%4;
			var b4=b3+1; b4=b4%4;
			function triangline2(pt1,pt2,spanarray) {
				if(pt2[1]>=pt1[1]) return;
				var i,j,y1,y2,x1;
				y1=Math.floor(pt1[1]); y2=Math.floor(pt2[1]);
				j=pt1[1]-y1;
				for(i=y1; i>y2; i--) {
					x1=pt1[0]+j*(pt2[0]-pt1[0])/(pt1[1]-pt2[1]);
					j++;
					spanarray[i]=Math.floor(x1);
				}
			}
			function triangline(pt1,pt2,ed1) {
				var x1,y1,x2,y2,x3,dx,dy,inc1,rest,spanarray;
				x1=Math.floor(pt1[0]*precision_screen); y1=Math.floor(pt1[1]*precision_screen);
				x2=Math.floor(pt2[0]*precision_screen); y2=Math.floor(pt2[1]*precision_screen);
				if(y2>y1) {
					spanarray=rightspan;
					x3=x1; x1=x2; x2=x3; x3=y1; y1=y2; y2=x3;
				} else spanarray=leftspan;
				dx=x2-x1; dy=y1-y2;
				if(dy<=0) return;
				if(edgebuffer[ed1][0]<0) {
					rest=y1%precision_screen; x3=x1*65536/precision_screen;
					if(dx<0) {
						dx=-dx;
						if(dx<dy) {
							inc1=Math.floor(65536*dx/dy);
							x3-=Math.floor(rest*inc1/precision_screen);
						}
						if(dx>=dy&&dx<dy*256) {
							inc1=Math.floor(256*dx/dy);
							x3-=Math.floor(rest*inc1*256/precision_screen);
							inc1*=256;
						}
						if(dx>=dy*256) {
							inc1=Math.floor(dx/dy);
							x3-=Math.floor(rest*inc1*65536/precision_screen);
							inc1*=65536;
						}
						inc1=-inc1;
					} else {
						if(dx<dy) {
							inc1=Math.floor(65536*dx/dy);
							x3+=Math.floor(rest*inc1/precision_screen);
						}
						if(dx>=dy&&dx<dy*256) {
							inc1=Math.floor(256*dx/dy);
							x3+=Math.floor(rest*inc1*256/precision_screen);
							inc1*=256;
						}
						if(dx>=dy*256) {
							inc1=Math.floor(dx/dy);
							x3+=Math.floor(rest*inc1*65536/precision_screen);
							inc1*=65536;
						}
					}
					y1=Math.floor(y1/precision_screen); y2=Math.floor(y2/precision_screen);
					
					edgebuffer[ed1][0]=y1; edgebuffer[ed1][1]=y2;
					edgebuffer[ed1][2]=x3; edgebuffer[ed1][3]=inc1;
				} else {
					y1=edgebuffer[ed1][0]; y2=edgebuffer[ed1][1];
					x3=edgebuffer[ed1][2]; inc1=edgebuffer[ed1][3];
				}
				for(i=y1; i>y2; i--) {
					spanarray[i]=Math.floor(x3/65536);
					x3+=inc1;
				}
			}
			
/*			triangline2(points[b],points[b2],leftspan);
			if(points[b3][1]>points[b2][1]) {
				triangline2(points[b3],points[b2],rightspan);
			} else {
				triangline2(points[b2],points[b3],leftspan);
			}
			if(points[b4][1]>points[b3][1]) {
				triangline2(points[b4],points[b3],rightspan);
			} else {
				triangline2(points[b3],points[b4],leftspan);
			}
			triangline2(points[b],points[b4],rightspan);*/
			
			triangline(points[b],points[b2],edges1[b]);
			triangline(points[b2],points[b3],edges1[b2]);
			triangline(points[b3],points[b4],edges1[b3]);
			triangline(points[b4],points[b],edges1[b4]);

			for(i=polybot; i>polytop; i--) {
				if(rightspan[i]>leftspan[i]) {
					ip=(i*xsize+leftspan[i])*4;
					for(j=leftspan[i]; j<rightspan[i]; j++) {
						data[ip]=color[0]; ip++;
						data[ip]=color[1]; ip++;
						data[ip]=color[2]; ip++;
						data[ip]=color[3]; ip++;						
					}
				}
			}
		}

		var i,j,k,col;
		var data=imagedata.data;
		var v1,v2,v3,v4,pt1,pt2,pt3,pt4;
		var edgebuffer=[];

		// edgebuffer: y1:16,dy:16,x1:32,increment:32
		for(i=0; i<12; i++) {
			edgebuffer.push([-1,-1,0,0]);
		}
		clearcanvasdata();
		for(i=0; i<facesq.length; i++) {
			v1=facesq[i][0]; v2=facesq[i][1];
			v3=facesq[i][2];
			// check visibility
			pt1=[transformedvert[v1][0],transformedvert[v1][1]];
			pt2=[transformedvert[v2][0],transformedvert[v2][1]];
			pt3=[transformedvert[v3][0],transformedvert[v3][1]];
			k=pt1[0]*(pt2[1]-pt3[1])+pt2[0]*(pt3[1]-pt1[1])+pt3[0]*(pt1[1]-pt2[1]); // triangle area
			if(Math.floor(k*precision_screen)>0) {
				col=[(facesq[i][4]&0xff000000)>>>24,(facesq[i][4]&0x00ff0000)>>>16,(facesq[i][4]&0x0000ff00)>>>8,facesq[i][4]&0x000000ff];
				v4=facesq[i][3];
				pt4=[transformedvert[v4][0],transformedvert[v4][1]];
				drawquad16([pt1,pt2,pt3,pt4],edges[i],col);
			}
		}
		//drawtriangle([[30,110],[120,50],[10,10]],[255,0,0]);
		scalecanvasdata();

		ctx.putImageData(imagedata,0,0);		
	}
	
	if(precision_screen==32) draw4(); else {
		if(culfaces.length>0) draw3();
	}
	//faces.splice(nfaces);
}

function animate() {
	var a1,b1,c1;
	if(precision_angle>0) {
		a1=Math.floor(gla*precision_angle/8192)*8192/precision_angle;
		b1=Math.floor(glb*precision_angle/8192)*8192/precision_angle;
		c1=Math.floor(glc*precision_angle/8192)*8192/precision_angle;
	} else {
		a1=gla; b1=glb; c1=glc;
	}
	drawmesh(a1*Math.PI/4096,b1*Math.PI/4096,c1*Math.PI/4096,0,0,2.7);
	glb+=8; if(glb>8192) glb-=8192;
	gla+=3; if(gla>8192) gla-=8192;
	glc+=4; if(glc>8192) glc-=8192;
	//gla=0.213; glb=0.3; glc=1.0;
	//gla=413; glb=300; glc=100;
	requestAnimationFrame(animate);
}
